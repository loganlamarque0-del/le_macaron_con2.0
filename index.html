
<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon jeu 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="menu">
    <h1>MON JEU 3D</h1>

  <div id="viseur">+</div>
  <div id="message"></div>

  <script type="module" src="script.js"></script>

</html>
