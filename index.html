<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat 3D</title>
    <link rel="stylesheet" href="style.css">

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>

    <div id="menu" class="overlay">
        <div class="panel">
            <h1>COMBAT 3D</h1>
            <p>Entre dans l'arène et bats tes adversaires !</p>
            <button id="playButton">JOUER</button>
            <p class="instructions">
                Z / W : avancer · S : reculer<br>
                A / D : côtés · ESPACE : sauter<br>
                Souris : regarder · Clic gauche : tirer
            </p>
        </div>
    </div>

    <div id="pause" class="overlay hidden">
        <div class="panel">
            <h1 id="pauseTitle">JEU EN PAUSE</h1>
            <p>Appuie sur E ou clique pour reprendre.</p>
            <button id="resumeButton">REPRENDRE</button>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="stat">VIE : <span id="health">100</span></div>
        <div class="stat">MUNITIONS : <span id="ammo">150</span></div>
        <div class="stat">ÉLIMINATIONS : <span id="kills">0</span></div>
    </div>

    <div id="crosshair" class="hidden">
        <div class="crosshair-line horizontal"></div>
        <div class="crosshair-line vertical"></div>
    </div>

    <div id="errorMessage" class="hidden"></div>

</body>
</html>
