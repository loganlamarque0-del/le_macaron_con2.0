
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu" class="overlay">
        <div class="panel">
            <h1>COMBAT 3D</h1>
            <p>Prêt pour le combat ?</p>
            <button id="playButton" disabled>CHARGEMENT...</button>
            <p id="status">Préparation du jeu...</p>
        </div>
    </div>

    <div id="pause" class="overlay hidden">
        <div class="panel">
            <h1 id="pauseTitle">PAUSE</h1>
            <p>Appuie sur E pour reprendre.</p>
            <button id="resumeButton">REPRENDRE</button>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="stats">
            <span>❤️ Vie : <b id="health">100</b></span>
            <span>🔫 Munitions : <b id="ammo">150</b></span>
            <span>Éliminations : <b id="kills">0</b></span>
        </div>
        <div id="help">
            Z/W : avancer · S : reculer · A/D : gauche/droite<br>
            Souris : tourner · Clic gauche : tirer · Espace : sauter · Échap : pause
        </div>
    </div>

    <div id="crosshair" class="hidden">
        <span></span>
    </div>

    <div id="errorMessage" class="hidden"></div>

    <script>
        const loadScript = (url) => new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = url;
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });

        (async () => {
            try {
                try {
                    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js");
                } catch {
                    await loadScript("https://unpkg.com/three@0.128.0/build/three.min.js");
                }

                await loadScript("script.js");

                document.getElementById("playButton").disabled = false;
                document.getElementById("playButton").textContent = "JOUER";
                document.getElementById("status").textContent = "Jeu prêt !";
            } catch (error) {
                document.getElementById("status").textContent =
                    "Erreur de chargement. Recharge la page.";
                document.getElementById("errorMessage").textContent =
                    "Impossible de charger le jeu. Vérifie ta connexion Internet.";
                document.getElementById("errorMessage").classList.remove("hidden");
                console.error(error);
            }
        })();
    </script>
</body>
</html>
