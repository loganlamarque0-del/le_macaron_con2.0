
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Combat 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <h1>COMBAT 3D</h1>
    <button id="jouer">JOUER</button>
    <p>Survis et élimine les ennemis !</p>
  </div>

  <div id="hud">
    <div>❤️ Vie : <span id="vie">100</span></div>
    <div>Éliminations : <span id="score">0</span></div>
    <div>Munition : <span id="ammo">30</span></div>
  </div>

  <div id="message"></div>

  <div id="pause" class="overlay">
    <h1>PAUSE</h1>
    <button id="reprendre">REPRENDRE</button>
    <button id="recommencer">RECOMMENCER</button>
  </div>

  <div id="gameover" class="overlay">
    <h1>PARTIE TERMINÉE</h1>
    <button id="rejouer">REJOUER</button>
  </div>

  <div id="mobileControls">
    <div class="movePad">
      <button data-key="z">▲</button>
      <div>
        <button data-key="q">◀
