<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combat 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <h1>COMBAT 3D</h1>
    <button id="playButton">JOUER</button>
    <p id="status">Chargement du jeu...</p>
  </div>

  <div id="hud" class="hidden">
    <div id="health">Vie : 100</div>
    <div id="ammo">Munitions : 150</div>
    <div id="crosshair">+</div>
    <div id="help">W/Z : avancer | S : reculer | D : gauche | A : droite | Clic gauche : tirer | Échap : libérer la souris</div>
  </div>

  <div id="pause" class="hidden">
    <h1>PAUSE</h1>
    <button id="resumeButton">REPRENDRE</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
