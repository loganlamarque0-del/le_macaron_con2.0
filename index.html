
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combat 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <h1>COMBAT 3D</h1>
    <p>Élimine les bots et récupère leurs récompenses !</p>
    <button id="playButton">JOUER</button>
    <p class="instructions">
      ZQSD / WASD : bouger · Souris : viser · Clic gauche : tirer<br>
      1 : fusil · R : recharger · Espace : sauter · Échap : pause
    </p>
  </div>

  <div id="hud">
    <div class="stat">❤️ Vie : <span id="health">100</span></div>
    <div class="stat">🔫 Balles : <span id="ammo">150</span></div>
    <div class="stat">☠️ Éliminations : <span id="kills">0</span></div>
    <div id="message"></div>
  </div>

  <div id="crosshair">+</div>

  <div id="mobileControls">
    <div id="mobileMove">
      <button data-move="forward">▲</button>
      <div>
        <button data-move="left">◀</button>
        <button data-move="back">▼</button>
        <button data-move="right">▶</button>
      </div>
    </div>
    <button id="mobileShoot">TIRER</button>
    <button id="mobileJump">SAUT</button>
  </div>

  <div id="pauseScreen">
    <h1>PAUSE</h1>
    <button id="resumeButton">REPRENDRE</button>
  </div>

  <div id="gameOver">
    <h1>PARTIE TERMINÉE</h1>
    <p>Éliminations : <span id="finalKills">0</span></p>
    <button id="restartButton">RECOMMENCER</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
